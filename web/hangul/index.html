<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>한글 문서</title>
<link rel="stylesheet" href="/host.css"><script src="/studio-editor-ui.js"></script></head><body data-state="LOADING">
<header class="studio-ui-header" aria-label="문서"><button id="back"></button><strong id="title">한글 문서</strong><span id="readonly-badge" hidden>읽기 전용</span><button id="undo" hidden></button><button id="redo" hidden></button><button id="search" hidden></button><button id="mode" disabled aria-pressed="false">편집하기</button><button id="save" hidden disabled></button><button id="more"></button></header>
<div id="status-row"><div id="status" role="status">원본 문서를 준비하고 있습니다…</div><button id="discard" hidden>저장되지 않은 변경 취소</button></div>
<iframe id="engine" title="한글 원본 문서 캔버스" src="/engine/index.html?chrome=embed&amp;renderer=canvas2d"></iframe>
<nav id="reader-pages" aria-label="페이지 탐색" hidden><button id="page-prev" aria-label="이전 페이지">‹</button><button id="page-number" aria-label="페이지 이동">1 / 1쪽</button><button id="reader-zoom" aria-label="화면 너비 맞춤">100%</button><button id="page-next" aria-label="다음 페이지">›</button></nav>
<section id="edit-dock" aria-label="모바일 편집 도구" hidden><section id="detail-sheet" hidden><div id="tools" role="toolbar" aria-label="선택한 문서 도구" hidden></div><div id="mobile-panel" aria-label="상세 편집 설정" hidden></div></section><div id="groups" class="studio-ui-dock" role="toolbar" aria-label="편집 도구" hidden></div></section>
<script src="/host.js" type="module"></script></body></html>
