name: Android install fix verification
on:
  push:
    branches: [codex/android-install-fix]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-install-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[install-diagnose]') && !contains(github.event.head_commit.message, '[publish-082]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          chmod +x gradlew
          mkdir -p artifacts/ci
          df -h .
          free -h
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Prepare fixtures and real Rhwp engine
        run: |
          ./gradlew :core:test :core:prepareVisualFixtures --configure-on-demand --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/fixtures.log
          python3 scripts/prepare-hangul-engine.py 2>&1 | tee artifacts/ci/hangul-prepare.log
      - name: JavaScript permissions and actual Rhwp browser tests
        run: |
          npm ci --prefix scripts/tests
          node --test scripts/tests/*.test.cjs 2>&1 | tee artifacts/ci/javascript.log
          cd scripts/tests
          npx playwright install --with-deps chromium
          npm run test:hangul 2>&1 | tee ../../artifacts/ci/hangul-browser.log
      - name: TypeScript and independent saved-file parsers
        run: |
          (cd .engine-cache/hangul/source/rhwp-studio && npx tsc --noEmit) 2>&1 | tee artifacts/ci/typescript.log
          ./gradlew :core:verifyVisualRoundTrip --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/roundtrip.log
      - name: Restore configured private signing key when available
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDIO_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          if os.environ.get('KEYSTORE_BASE64'):
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'studio-signing.jks'
              path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
              path.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as f:f.write('STUDIO_KEYSTORE='+str(path)+'\n')
          PY
      - name: Unit tests and ARM64 phone APK
        env:
          STUDIO_STORE_PASSWORD: ${{ secrets.STUDIO_STORE_PASSWORD }}
          STUDIO_KEY_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          STUDIO_KEY_PASSWORD: ${{ secrets.STUDIO_KEY_PASSWORD }}
        run: |
          mkdir -p artifacts/install-build
          ./gradlew -PstudioAbi=arm64-v8a :core:test :core:prepareVisualFixtures :officeruntime:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/gradle-arm64.log
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/install-build/arm64-v8a.apk
      - name: x86_64 APK and instrumentation
        env:
          STUDIO_STORE_PASSWORD: ${{ secrets.STUDIO_STORE_PASSWORD }}
          STUDIO_KEY_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          STUDIO_KEY_PASSWORD: ${{ secrets.STUDIO_KEY_PASSWORD }}
        run: |
          ./gradlew -PstudioAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/gradle-x86.log
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/install-build/x86_64.apk
      - name: Retrieve the original installation failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40315271572 --name android-install-diagnosis-632018a72e2275282dbd4eb814de145a1437d6d0 --dir artifacts/previous-install
      - name: Enable emulator acceleration
        run: |
          ./gradlew --stop
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 35 installation and full P0 checks
        env:
          STUDIO_ABI: x86_64
          STUDIO_PACKAGE: kr.documentstudio.preview
          STUDIO_STORE_PASSWORD: ${{ secrets.STUDIO_STORE_PASSWORD }}
          STUDIO_KEY_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          STUDIO_KEY_PASSWORD: ${{ secrets.STUDIO_KEY_PASSWORD }}
        id: android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            python3 scripts/test-preview-installation.py
            bash scripts/run-android-mode-tests.sh
      - name: Verify ABI packages and package exact source and evidence
        env:
          EMULATOR_OUTCOME: ${{ steps.android.outcome }}
        run: python3 scripts/package-install-fix.py
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: document-studio-install-fix-${{ github.sha }}
          path: artifacts/delivery/
          if-no-files-found: error
          compression-level: 0
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs-${{ github.sha }}
          path: |
            artifacts/ci/
            artifacts/install-fixed/
            artifacts/previous-install/
            artifacts/document-engines/
            artifacts/native-android/
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            officeruntime/build/test-results/
            app/build/test-results/
          if-no-files-found: warn
