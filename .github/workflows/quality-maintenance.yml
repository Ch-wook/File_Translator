name: Cancel only superseded unpatched quality candidates
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[quality-maintenance]')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          obsolete=[
              (41812795215,"4bf47715f28fc768349839c48613fab0d0bdcfce","Reading UX and performance comparison"),
              (41812795133,"4bf47715f28fc768349839c48613fab0d0bdcfce","Release structure and public dependency audit"),
              (41812795237,"4bf47715f28fc768349839c48613fab0d0bdcfce","Build and verify mobile editing APKs"),
          ]
          for run,expected_sha,expected_name in obsolete:
              info=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
              assert info['head_sha']==expected_sha and info['head_sha']!="b68d31951ffa881c8784ad30897ddc8dfd0fd4de"
              assert info['name']==expected_name
              assert info['head_branch']=='codex/hangul-mobile-editing' and info['event']=='push'
              if info['status'] in ('queued','in_progress'):subprocess.run(['gh','api',f'repos/{repo}/actions/runs/{run}/cancel','--method','POST'],check=True)
          print('ONLY_SUPERSEDED_UBUNTU_LATEST_RUNS_CANCELLED')
          PY
