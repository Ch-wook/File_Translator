name: Publish verified data safety and commercial quality preview
on:
  push:
    branches: [codex/hangul-mobile-editing]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-document-studio-0811
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-0811]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: b247dbd28ac64e96dbd9a4d2f5e45f7fba451a5c
      VERIFIED_RUN: '40792907517'
      PERFORMANCE_RUN: '40792907398'
      SECURITY_RUN: '40792781293'
      PREVIEW_TAG: v0.8.11-preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate embedded publication scripts before downloads
        run: |
          python3 - <<'PY'
          import ast,pathlib,re,textwrap
          source=pathlib.Path('.github/workflows/publish-quality-preview.yml').read_text()
          blocks=re.findall(r"(?m)^([ ]*)python3 - <<'PY'\n(.*?)^\1PY[ \t]*$",source,re.S)
          assert len(blocks)==4,len(blocks)
          for _,block in blocks:ast.parse(textwrap.dedent(block))
          print('PUBLICATION_SCRIPTS_VALID',len(blocks))
          PY
      - name: Validate and reuse the exact installation-tested packages
        run: |
          pip install Pillow
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile,io
          from PIL import Image
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['VERIFIED_SHA'];run=os.environ['VERIFIED_RUN']
          previous=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v0.8.10-preview']))
          previous_tag=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/ref/tags/v0.8.10-preview']))['object']['sha']
          preserved={'releaseId':previous['id'],'tagCommit':previous_tag,'assets':sorted([{'id':a['id'],'name':a['name'],'size':a['size'],'digest':a.get('digest')} for a in previous['assets']],key=lambda a:a['name'])}
          pathlib.Path('previous-release-snapshot.json').write_text(json.dumps(preserved,indent=2))
          info=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          assert info['head_sha']==sha and info['status']=='completed',info
          package_run=os.environ.get('PACKAGE_RUN') or run
          if info['conclusion']!='success':
              assert info['conclusion']=='failure' and package_run!=run,info
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/jobs']))['jobs']
              assert len(jobs)==1
              stages={s['name']:s['conclusion'] for s in jobs[0]['steps']}
              required=['Real offline engine, TypeScript and fixtures','Reproduce old metadata failure, verify host regressions and compile Android tests','Real browser editing and independent saved-file parsers','Unit tests, lint and ARM64 phone APK','x86_64 APK and instrumentation','Installation, actual Android IME and full P0 regression']
              assert all(stages[n]=='success' for n in required),stages
              assert [n for n,c in stages.items() if c=='failure']==['Verify ABI packages, signatures, all test results and exact source']
              recovery=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{package_run}']))
              assert recovery['status']=='completed' and recovery['conclusion']=='success',recovery
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',sha,'HEAD'],text=True).splitlines()
          assert all(p in ('README.md','scripts/package-mobile-release.py') or p.startswith(('docs/','.github/workflows/')) for p in changed),changed
          subprocess.run(['gh','run','download',package_run,'--name','document-studio-mobile-'+sha,'--dir','delivery'],check=True)
          delivery=pathlib.Path('delivery')
          perf_run=os.environ['PERFORMANCE_RUN']
          perf_info=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{perf_run}']))
          assert perf_info['head_sha']==sha and perf_info['conclusion']=='success',perf_info
          subprocess.run(['gh','run','download',perf_run,'--name','reading-performance-'+sha,'--dir','performance'],check=True)
          performance=pathlib.Path('performance')
          security_run=os.environ['SECURITY_RUN']
          security_info=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{security_run}']))
          assert security_info['conclusion']=='success',security_info
          security_sha=security_info['head_sha']
          subprocess.run(['git','merge-base','--is-ancestor',security_sha,sha],check=True)
          security_delta=subprocess.check_output(['git','diff','--name-only',security_sha,sha],text=True).splitlines()
          assert not any(p.startswith(('app/src/main/','core/src/main/','officeruntime/','web/','shared/','config/')) or p in ('app/build.gradle.kts','core/build.gradle.kts','build.gradle.kts') for p in security_delta),security_delta
          subprocess.run(['gh','run','download',security_run,'--name','quality-security-'+security_sha,'--dir','quality-security'],check=True)
          security_dir=pathlib.Path('quality-security')
          security_summary=json.loads((security_dir/'summary.json').read_text())
          assert security_summary['releaseUnsignedBuild'] and security_summary['releaseDebugFixturesAbsent'] and security_summary['advisoryQueryCompleted']
          assert security_summary['releaseInternetPermission'] is False and security_summary['commercialReady'] is False
          print('LIMITED_RELEASE_SECURITY_EVIDENCE',json.dumps(security_summary),flush=True)
          comparison=json.loads((performance/'comparison.json').read_text())
          assert comparison['candidateCommit']==sha and comparison['baselineCommit']=='aa3414f1fae89f5f98d10dabb64df85bfd7fc1df',comparison
          assert set(comparison['records'])=={'baseline','candidate'}
          for item in comparison['records'].values():assert item['viewport-memory']['allClosedBitmapsRecycled'] and item['viewport-memory']['pdfOriginalUnchanged']
          assert comparison['records']['candidate']['viewport-memory']['rasters'],comparison
          print('SAME_EMULATOR_PERFORMANCE_VERIFIED',json.dumps(comparison),flush=True)
          for line in (delivery/'SHA256SUMS').read_text().splitlines():
              expected,name=line.split('  ',1);p=delivery/name;assert p.parent==delivery and p.is_file()
              with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==expected,name
          with zipfile.ZipFile(delivery/'document-studio-0.8.11-preview-verification.zip') as z:
              assert z.testzip() is None
              result=json.loads(z.read('artifacts/ci/summary.json'))
              assert result['commit']==sha and result['androidEmulatorOutcome']=='success' and result['physicalDeviceTested'] is False,result
              assert result['androidTests']=={'tests':65,'failures':0,'errors':0,'skipped':0},result
              if package_run!=run:
                  recovered=json.loads(z.read('artifacts/ci/packaging-recovery.json'))
                  assert recovered['apkBuildCommit']==sha and recovered['originalTestRun']==int(run) and recovered['packagingRun']==int(package_run)
                  assert recovered['originalTestsPassed'] is True and recovered['apkRebuilt'] is False,recovered
              regression=json.loads(z.read('artifacts/ci/open-regression/summary.json'))
              assert regression=={'before':{'tests':3,'failures':3,'errors':0,'skipped':0},'after':{'tests':3,'failures':0,'errors':0,'skipped':0}},regression
              for name in ('metadata-free-hwp.json','metadata-free-hwpx.json','distribution-read-only.json'):
                  proof=json.loads(z.read('artifacts/native-android/native-document-open/'+name))
                  assert all(v is True or k=='originalSha256' for k,v in proof.items()),proof
              for abi in ('arm64-v8a','x86_64'):
                  manifest=z.read('artifacts/ci/'+abi+'-manifest.txt').decode()
                  assert "minSdkVersion:'29'" in manifest and "targetSdkVersion:'36'" in manifest,manifest
              install=result['installation']
              assert install['cleanInstallWithoutTestFlag'] and install['coexistsWith0810'] and install['priorApkHashUnchanged'] and install['priorPrivateDataPreserved'] and install['sameSignerReinstallPreservedPrivateData'],install
              for counts in result['unitTests'].values():assert counts['tests']>0 and counts['failures']==counts['errors']==counts['skipped']==0
              assert {name:counts['tests'] for name,counts in result['unitTests'].items()}=={'core':128,'officeruntime':2,'app':45},result['unitTests']
              assert result['signatureConversionVerified'] is True
              assert len(result['signatureEngineTests'])==2
              assert result['additionalBundledFontFamilies']==6 and result['nativeCalc']['nativeFormulaResults']==15,result
              assert all(result['nativeCalc'][k] is True for k in ['nativePaste','nativeCellFontBoldSize','nativeNewSheet','providerSaved','parserReopened','engineReopened','originalProtected']),result
              assert result['originalBrowserScenarios']==5 and result['javascriptTests']==28 and result['independentPartialFormattingParser'],result
              # Independent checks of native PDF renderer output from the APK tests.
              layoutProof={}
              def colored(name,predicate):
                  im=Image.open(io.BytesIO(z.read('artifacts/native-android/native-conversion/'+name+'-page1.png'))).convert('RGB')
                  w,h=im.size
                  points=[(i%w/w,i//w/h) for i,rgb in enumerate(im.getdata()) if predicate(rgb)]
                  return im,points
              ppt,blue=colored('pptx',lambda c:c[2]>200 and c[0]<60 and c[1]<90)
              _,red=colored('pptx',lambda c:c[0]>150 and c[1]<90 and c[2]<100)
              assert len(blue)>500 and sum(.06<x<.25 and .25<y<.55 for x,y in blue)/len(blue)>.9,('PPT image position',len(blue))
              assert len(red)>500 and sum(.64<x<.87 and .25<y<.65 for x,y in red)/len(red)>.9,('PPT shape position',len(red))
              background=sum(abs(r-235)<8 and abs(g-240)<8 and abs(b-250)<8 for r,g,b in ppt.getdata())
              assert background/(ppt.width*ppt.height)>.4,'PPT background missing'
              _,docxBlue=colored('docx',lambda c:c[2]>200 and c[0]<60 and c[1]<90)
              _,yellow=colored('xlsx',lambda c:c[0]>200 and c[1]>200 and c[2]<80)
              assert len(docxBlue)>100 and len(yellow)>100,('DOCX picture or XLSX fill missing',len(docxBlue),len(yellow))
              layoutProof={'pptImagePosition':True,'pptShapePosition':True,'pptBackground':True,'docxPicture':True,'xlsxCellFill':True}
              print('INDEPENDENT_NATIVE_PDF_LAYOUT_VERIFIED',json.dumps(layoutProof),flush=True)
              mobile=result['mobileEngineTests']
              assert len(mobile)==2 and {r['format'] for r in mobile}=={'hwp','hwpx'}
              for r in mobile:
                  assert r['partialSelection'] and r['savedAndReopened'] and r['autosave'] and r['atomicPasteUndoRedo'],r
                  assert r['structure']['mergeSplitCycles']==3 and all(v is True or k=='mergeSplitCycles' for k,v in r['structure'].items()),r
          apks=result['apks'];assert {a['abi'] for a in apks}=={'arm64-v8a','x86_64'}
          assert len({a['certificateSHA256'] for a in apks})==1
          for item in apks:
              assert item['applicationId']=='kr.documentstudio.qualitypreview' and item['versionCode']==21 and item['versionName']=='0.8.11-preview' and not item['testOnly'] and item['elf16k']
              p=delivery/item['file'];assert p.stat().st_size==item['bytes']
              with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==item['sha256']
          archive_sha=result.get('sourceArchiveCommit',sha)
          subprocess.run(['git','merge-base','--is-ancestor',sha,archive_sha],check=True)
          archive_delta=subprocess.check_output(['git','diff','--name-only',sha,archive_sha],text=True).splitlines()
          assert all(p in ('README.md','scripts/package-mobile-release.py') or p.startswith(('docs/','.github/workflows/')) for p in archive_delta),archive_delta
          with zipfile.ZipFile(delivery/'document-studio-0.8.11-preview-source.zip') as z:
              assert z.testzip() is None
              tracked={}
              for entry in subprocess.check_output(['git','ls-tree','-r','-z',archive_sha]).split(b'\0'):
                  if not entry:continue
                  meta,path=entry.split(b'\t',1);mode,kind,blob=meta.split();assert kind==b'blob'
                  tracked[path.decode()]=blob.decode()
              assert {p.filename for p in z.infolist() if not p.is_dir()}==set(tracked)
              for path,blob in tracked.items():
                  data=z.read(path);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob,path
          # Preserve the tested APK bytes, while publishing source from this tag's
          # metadata-only descendant (the app/engine sources were checked above).
          archive=delivery/'document-studio-0.8.11-preview-source.zip'
          subprocess.run(['git','archive','--format=zip','-o',str(archive),'HEAD'],check=True)
          published_tracked={}
          for entry in subprocess.check_output(['git','ls-tree','-r','-z','HEAD']).split(b'\0'):
              if not entry:continue
              meta,path=entry.split(b'\t',1);mode,kind,blob=meta.split();assert kind==b'blob'
              published_tracked[path.decode()]=blob.decode()
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert {p.filename for p in z.infolist() if not p.is_dir()}==set(published_tracked)
              for path,blob in published_tracked.items():
                  data=z.read(path);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob,path
          patch=delivery/'document-studio-0.8.11-preview-changes.patch'
          with patch.open('wb') as f:
              subprocess.run(['git','diff','--binary','aa3414f1fae89f5f98d10dabb64df85bfd7fc1df','HEAD'],stdout=f,check=True)
          subprocess.run(['git','apply','--check','--reverse',str(patch)],check=True)
          bundle=delivery/'document-studio-0.8.11-preview-history.bundle'
          bundle.unlink()
          subprocess.run(['git','bundle','create',str(bundle),'--all'],check=True)
          subprocess.run(['git','bundle','verify',str(bundle)],check=True)
          provenance={'apkBuildCommit':sha,'sourceArchiveCommit':os.environ['GITHUB_SHA'],'metadataOnlyChanges':changed,'trackedFiles':len(published_tracked),'appSourceUnchanged':True}
          metadata=delivery/'document-studio-0.8.11-preview-apk-metadata.json'
          data=json.loads(metadata.read_text());data['sourceArchiveCommit']=os.environ['GITHUB_SHA'];metadata.write_text(json.dumps(data,indent=2))
          with zipfile.ZipFile(delivery/'document-studio-0.8.11-preview-verification.zip','a',zipfile.ZIP_DEFLATED) as z:
              entry='artifacts/ci/published-source-provenance.json';assert entry not in z.namelist()
              z.writestr(entry,json.dumps(provenance,indent=2));z.writestr('artifacts/ci/published-layout-validation.json',json.dumps(layoutProof,indent=2));assert z.testzip() is None
          verification=delivery/'document-studio-0.8.11-preview-verification.zip'
          with zipfile.ZipFile(verification,'a',zipfile.ZIP_DEFLATED) as z:
              for p in performance.rglob('*'):
                  if p.is_file() and p.suffix!='.apk':z.write(p,'artifacts/reading-performance/'+p.relative_to(performance).as_posix())
              assert z.testzip() is None
          with zipfile.ZipFile(verification,'a',zipfile.ZIP_DEFLATED) as z:
              for p in security_dir.rglob('*'):
                  if p.is_file():z.write(p,'artifacts/quality-security/'+p.relative_to(security_dir).as_posix())
              z.writestr('artifacts/quality-security/build-provenance.json',json.dumps({'auditCommit':security_sha,'appBuildCommit':sha,'nonApplicationChanges':security_delta},indent=2))
              assert z.testzip() is None
          (delivery/'document-studio-0.8.11-preview-work-report.md').write_text(pathlib.Path('docs/COMMERCIAL_QUALITY_RESULTS.md').read_text())
          readme=delivery/'README.txt'
          readme.write_text(readme.read_text()+'\n소스 ZIP·패치·Git 이력은 태그의 최종 문서·CI를 포함합니다. 앱 코드·엔진·APK는 위 빌드 커밋과 동일합니다.\n소스 아카이브 커밋: '+os.environ['GITHUB_SHA']+'\n')
          def published_digest(path):
              with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          (delivery/'SHA256SUMS').write_text(''.join(published_digest(p)+'  '+p.name+'\n' for p in sorted(delivery.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          for item in apks:
              with (delivery/item['file']).open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==item['sha256'],item['file']
          print('PUBLISHED_SOURCE_MATCHES_TAG_AND_TESTED_APP',json.dumps(provenance),flush=True)
          units={key:sum(counts[key] for counts in result['unitTests'].values()) for key in ('tests','failures','errors','skipped')}
          notes=(delivery/'README.txt').read_text()
          notes+='\n실행 검증: Android '+str(result['androidTests']['tests'])+'건, 단위 '+str(units['tests'])+'건 — 실패·오류·건너뜀 0건.\n'
          notes+='이름/MIME 조회 회귀: 동일 3건에서 수정 전 3건 실패 → 수정 후 3건 통과.\n'
          notes+='실제 엔진 브라우저 9개 시나리오, JavaScript 28건, TypeScript·lint, HWP/HWPX 독립 저장 파서 검사 통과.\n'
          notes+='설치·기존 0.8.10 APK/개인 데이터 보존·재설치 확인. 실제 ARM64 휴대폰 검증은 미완료.\n'
          notes+='성능 비교는 동일 Android 35 x86_64 에뮬레이터의 순차 실행입니다. 실기기·60fps·모든 버튼 100ms 이내를 보장하지 않습니다. 상세 값과 느려진 항목도 작업 보고서에 기록했습니다.\n'
          notes+='전체 결과·원본 해시·재열기 증거는 verification.zip에 포함했습니다.\n'
          notes+='unsigned Release의 디버그 검사 구성요소 미포함, 직접 INTERNET 권한 없음, 공개 Maven 의존성 '+str(security_summary['runtimeMavenModules'])+'개 조회를 검증했습니다. 알려진 일치 '+str(security_summary['advisoryMatches'])+'건의 범위·판정은 보고서를 확인하세요. 네이티브/Wasm 전체 보안 인증이 아닙니다.\n'
          notes+='실제 기기·접근성 전수·운영 서명·스토어·악성 문서/개인정보 법무 검토가 남아 상용 출시 완료로 판정하지 않습니다.\n'
          for item in apks:notes+='\n'+item['abi']+': '+str(item['bytes'])+' bytes, SHA-256 '+item['sha256']+'\n'
          notes+='\n빌드 커밋: '+sha+'\n태그 커밋: '+os.environ['GITHUB_SHA']+' (앱 코드 차이 없음; 배포 문서·CI만 추가)\n'
          notes+='읽기 화면·성능 측정 결과·검증: https://github.com/'+repo+'/blob/codex/hangul-mobile-editing/docs/COMMERCIAL_QUALITY_RESULTS.md\n'
          notes+='기능·검증·지원 제한: https://github.com/'+repo+'/blob/codex/hangul-mobile-editing/docs/HANGUL_MOBILE_EDITING.md\n'
          pathlib.Path('release-notes.md').write_text(notes)
          print('VERIFIED_MOBILE_EDITING_ARTIFACTS',json.dumps(result),flush=True)
          PY
      - name: Upload and verify every asset before publishing
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA'];verified=os.environ['VERIFIED_SHA'];tag=os.environ['PREVIEW_TAG']
          def api(path,*args):return json.loads(subprocess.check_output(['gh','api',path,*args]))
          def same_app(commit):
              subprocess.run(['git','merge-base','--is-ancestor',verified,commit],check=True)
              names=subprocess.check_output(['git','diff','--name-only',verified,commit],text=True).splitlines()
              assert all(p in ('README.md','scripts/package-mobile-release.py') or p.startswith(('docs/','.github/workflows/')) for p in names),names
          releases=api(f'repos/{repo}/releases?per_page=100');existing=[r for r in releases if r['tag_name']==tag]
          expected={p.name:p for p in pathlib.Path('delivery').iterdir() if p.is_file()}
          assert len(expected)==10,sorted(expected)
          if existing:
              assert len(existing)==1
              release=existing[0]
              assert release['author']['login']=='github-actions[bot]' and release['prerelease'],'inspect preexisting release'
              same_app(release['target_commitish'])
          else:
              ref=subprocess.run(['gh','api',f'repos/{repo}/git/ref/tags/{tag}'],capture_output=True,text=True)
              if ref.returncode==0:
                  obj=json.loads(ref.stdout)['object'];assert obj['type']=='commit';same_app(obj['sha'])
              else:assert '404' in ref.stderr,ref.stderr
              subprocess.run(['gh','release','create',tag,*[str(p) for p in sorted(expected.values())],
                              '--draft','--prerelease','--target',sha,'--title','문서 스튜디오 0.8.11-preview · 저장 복구·서명 보호·모바일 품질 개선',
                              '--notes-file','release-notes.md'],check=True)
              release=next(r for r in api(f'repos/{repo}/releases?per_page=100') if r['tag_name']==tag)
          assets=api(f"repos/{repo}/releases/{release['id']}/assets?per_page=100")
          assert {a['name'] for a in assets}==set(expected),'inspect partial or unexpected release assets'
          readback=pathlib.Path('upload-readback');readback.mkdir()
          for asset in assets:
              source=expected[asset['name']];dest=readback/source.name
              assert asset['state']=='uploaded' and asset['size']==source.stat().st_size,asset['name']
              assert asset['url'].startswith('https://api.github.com/repos/'+repo+'/releases/assets/')
              req=urllib.request.Request(asset['url'],headers={'Accept':'application/octet-stream'})
              req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(req,timeout=120) as response,dest.open('wb') as f:shutil.copyfileobj(response,f,1024*1024)
              with source.open('rb') as f:source_hash=hashlib.file_digest(f,'sha256').hexdigest()
              with dest.open('rb') as f:uploaded_hash=hashlib.file_digest(f,'sha256').hexdigest()
              assert source.stat().st_size==dest.stat().st_size and source_hash==uploaded_hash,source.name
              if asset.get('digest'):assert asset['digest']=='sha256:'+source_hash
          print('ALL_UPLOADED_ASSETS_MATCH_VERIFIED_BUILD',len(expected),flush=True)
          if release['draft']:
              release=api(f"repos/{repo}/releases/{release['id']}",'--method','PATCH','-f','target_commitish='+sha,'-F','draft=false','-F','prerelease=true','-f','body='+pathlib.Path('release-notes.md').read_text())
          assert not release['draft'] and release['prerelease']
          PY
      - name: Verify anonymous public downloads and the actual tag
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['PREVIEW_TAG'];verified=os.environ['VERIFIED_SHA']
          ref=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/tags/'+tag]))
          assert ref['object']['type']=='commit';tag_sha=ref['object']['sha']
          subprocess.run(['git','merge-base','--is-ancestor',verified,tag_sha],check=True)
          names=subprocess.check_output(['git','diff','--name-only',verified,tag_sha],text=True).splitlines()
          assert all(p in ('README.md','scripts/package-mobile-release.py') or p.startswith(('docs/','.github/workflows/')) for p in names),names
          results=[]
          for p in sorted(pathlib.Path('delivery').iterdir()):
              if not p.is_file():continue
