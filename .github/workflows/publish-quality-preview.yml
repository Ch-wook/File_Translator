          preserved={'releaseId':previous['id'],'tagCommit':previous_tag,'assets':sorted([{'id':a['id'],'name':a['name'],'size':a['size'],'digest':a.get('digest')} for a in previous['assets']],key=lambda a:a['name'])}
          assert preserved==json.loads(pathlib.Path('previous-release-snapshot.json').read_text()),'Existing 0.8.10 release changed'
          proof={'verifiedBuildCommit':verified,'tagCommit':tag_sha,'assets':results,'previousReleasePreserved':True,'previousRelease':preserved,'apkRebuilt':False,'apkResigned':False}
          pathlib.Path('release-download-verification.json').write_text(json.dumps(proof,indent=2))
          print('PUBLIC_MOBILE_EDITING_DOWNLOADS_VERIFIED',json.dumps(proof),flush=True)
