name: Finalize reading preview notes and download evidence
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-document-studio-089
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[finalize-reading]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct release notes, preserve tested bytes and verify public downloads
        run: |
          python3 - <<'PY'
          import ast,hashlib,json,os,pathlib,shutil,subprocess,time,urllib.request,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];tag='v0.8.9-preview'
          initial=json.loads("{\"verifiedBuildCommit\":\"34831b1ee82386bf7a1a93b989a4edbe1de77422\",\"tagCommit\":\"4a9fabb7065fffaa9896ca23bc4475d00a2147b1\",\"assets\":[{\"name\":\"README.txt\",\"bytes\":3686,\"sha256\":\"812632f290779dc1c75a0668435d57233f659457cf97e54557413f5f3d233c30\",\"publicDownloadVerified\":true},{\"name\":\"SHA256SUMS\",\"bytes\":960,\"sha256\":\"ce43ffeab34bf62fa14e9d605f95a3b052cc107fc164d966ddb6907085777eee\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-apk-metadata.json\",\"bytes\":1116,\"sha256\":\"9e0cd6f0d27aea4139d4f761904986af595532519a1aa375f3329229388bd887\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-arm64-v8a.apk\",\"bytes\":429906497,\"sha256\":\"6e3be719a2836a9aae2f5be30d2ae8c1b19b095487a9926ad1c6e8f7e2ec1b63\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-changes.patch\",\"bytes\":241723,\"sha256\":\"2fd64ed7d2fbfe7fdc10641ceae536a89d42e059fe59d2c4a30539989b844df8\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-history.bundle\",\"bytes\":9081595,\"sha256\":\"1f8151fbbe49208508e67443d9a711be7bdc4a354a55bca2f8d3cb451dc7bc95\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-source.zip\",\"bytes\":8552919,\"sha256\":\"804fe5330de86a4608afb33345fe242a1813a31fc07ea1a9a45ed33b5f5f42a4\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-verification.zip\",\"bytes\":5593799,\"sha256\":\"162329d945c3bc474be0ad3600e5555d4d54422eaf16607968ed13c421e2526a\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-work-report.md\",\"bytes\":20501,\"sha256\":\"78518048c1c90b1e2b0ad76def48b958542bf3164b162e0011efb2391c0360f2\",\"publicDownloadVerified\":true},{\"name\":\"document-studio-0.8.9-preview-x86_64.apk\",\"bytes\":441792987,\"sha256\":\"0d8e78a3ed7cc9765acb76254f2bd27ff88f6239ce70f4e8852085e4a669620e\",\"publicDownloadVerified\":true}]}")
          preserved=json.loads("{\"releaseId\":426498150,\"tagCommit\":\"82ebfd658f0c653b7ffa37ad1b64720b727d8707\",\"assets\":[{\"id\":684556351,\"name\":\"document-studio-0.8.8-preview-apk-metadata.json\",\"size\":1116,\"digest\":\"sha256:6f7eebacc21a8e4c11911800129d4994af82832e82ebdabb381e1e1cdbde48e3\"},{\"id\":684556337,\"name\":\"document-studio-0.8.8-preview-arm64-v8a.apk\",\"size\":429805261,\"digest\":\"sha256:27e57435f7f9b7dec13a3104fc979a10c7fbb2a3278353006a48142c87dacdb9\"},{\"id\":684556348,\"name\":\"document-studio-0.8.8-preview-changes.patch\",\"size\":198118,\"digest\":\"sha256:00339bd52b6dfa4b3141ca7842ab276420aec24f0ecb3780bc88125dc9c26048\"},{\"id\":684556378,\"name\":\"document-studio-0.8.8-preview-history.bundle\",\"size\":8969992,\"digest\":\"sha256:6937050087af47e7f494e731d2b17d1be649096d5aa9853b32f627ce4947b0e7\"},{\"id\":684556381,\"name\":\"document-studio-0.8.8-preview-source.zip\",\"size\":8507734,\"digest\":\"sha256:12ae526ae753bcc437635f032ccb2d34485472fab91831e994251b85824879ac\"},{\"id\":684556379,\"name\":\"document-studio-0.8.8-preview-verification.zip\",\"size\":4543565,\"digest\":\"sha256:482966ef90af8496021fef85ce68d8013cd203554a96198be1403d88ce32ad6e\"},{\"id\":684556387,\"name\":\"document-studio-0.8.8-preview-work-report.md\",\"size\":16123,\"digest\":\"sha256:176f302f2fc5fa3ab2688e93ff58a5dd47945661360bf94cccfdc38587307b2e\"},{\"id\":684556412,\"name\":\"document-studio-0.8.8-preview-x86_64.apk\",\"size\":441691751,\"digest\":\"sha256:9ab80633d8c76fc66b489857b0a451a17f37703cc554a4cd92e564ee3f413eb9\"},{\"id\":684556349,\"name\":\"README.txt\",\"size\":3688,\"digest\":\"sha256:bc34d5e3cd0dbbbaf9ef42cc7f286f43302bd5de8f546d2eae7beb5145917845\"},{\"id\":684556352,\"name\":\"SHA256SUMS\",\"size\":960,\"digest\":\"sha256:93116c2c0e71de525c3ab3d44bb426c3f5e2e85703793eb86597de164ca21616\"}]}")
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          def digest(path):
              with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          def old_release_snapshot():
              previous=api('releases/tags/v0.8.8-preview')
              return {'releaseId':previous['id'],'tagCommit':api('git/ref/tags/v0.8.8-preview')['object']['sha'],'assets':[{'id':a['id'],'name':a['name'],'size':a['size'],'digest':a.get('digest')} for a in previous['assets']]}
          def download(name,dest):
              url=f'https://github.com/{repo}/releases/download/{tag}/{name}'
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as response,dest.open('wb') as f:shutil.copyfileobj(response,f,1024*1024)
                      return
                  except Exception:
                      if attempt==3:raise
                      time.sleep(5)
          original=api('releases/tags/'+tag)
          assert not original['draft'] and original['prerelease'] and original['author']['login']=='github-actions[bot]'
          tag_sha=api('git/ref/tags/'+tag)['object']['sha'];assert tag_sha==initial['tagCommit']
          subprocess.run(['git','merge-base','--is-ancestor',initial['verifiedBuildCommit'],'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',initial['verifiedBuildCommit'],'HEAD'],text=True).splitlines()
          assert all(p in ('README.md','scripts/package-mobile-release.py') or p.startswith(('docs/','.github/workflows/')) for p in changed),changed
          assert old_release_snapshot()==preserved,'Existing 0.8.8 assets changed'
          main_sha=api('git/ref/heads/main')['object']['sha']
          assert main_sha=='ec785811be646e4ef0fcf79156864ddaf43de94c'
          expected={a['name']:a for a in initial['assets']}
          assert len(expected)==10 and {a['name'] for a in original['assets']}==set(expected)
          delivery=pathlib.Path('delivery');delivery.mkdir()
          for name,item in expected.items():
              assert pathlib.Path(name).name==name
              target=delivery/name;download(name,target)
              assert target.stat().st_size==item['bytes'] and digest(target)==item['sha256'],name
          for line in (delivery/'SHA256SUMS').read_text().splitlines():
              value,name=line.split('  ',1);assert digest(delivery/name)==value,name
          with zipfile.ZipFile(delivery/'document-studio-0.8.9-preview-source.zip') as z:
              assert z.testzip() is None
              for entry in subprocess.check_output(['git','ls-tree','-r','-z',tag_sha]).split(b'\0'):
                  if not entry:continue
                  meta,path=entry.split(b'\t',1);_,kind,blob=meta.split();assert kind==b'blob'
                  data=z.read(path.decode());assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob.decode()
          # Update only our generated README/checksum metadata. APKs and all
          # source, history, patch, report and verification assets stay unchanged.
          package_tree=ast.parse(pathlib.Path('scripts/package-mobile-release.py').read_text())
          readmes=[n.value for n in ast.walk(package_tree) if isinstance(n,ast.Constant) and isinstance(n.value,str) and n.value.startswith('문서 스튜디오 읽기 개선 0.8.9-preview\n')]
          assert len(readmes)==1
          readme=readmes[0]+initial['verifiedBuildCommit']+'\n소스 아카이브/태그 커밋: '+tag_sha+'\n'
          readme+='\n최종 전체 회귀: Android52건·단위150건·JavaScript28건, 브라우저9개 시나리오, 실패·오류·건너뜀0건.\n'
          readme+='APK는 해당 전체 회귀 작업에서 검사한 동일 바이트이며 다시 빌드/서명하지 않았습니다.\n'
          (delivery/'README.txt').write_text(readme)
          (delivery/'SHA256SUMS').write_text(''.join(digest(p)+'  '+p.name+'\n' for p in sorted(delivery.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          for name in ('README.txt','SHA256SUMS'):
              subprocess.run(['gh','release','upload',tag,str(delivery/name),'--clobber'],check=True)
          notes='[휴대폰 ARM64 APK](https://github.com/'+repo+'/releases/download/'+tag+'/document-studio-0.8.9-preview-arm64-v8a.apk) · [소스 ZIP](https://github.com/'+repo+'/releases/download/'+tag+'/document-studio-0.8.9-preview-source.zip) · [상세 작업·측정 보고서](https://github.com/'+repo+'/blob/'+tag+'/docs/READING_PERFORMANCE_RESULTS.md)\n\n'+readme
          pathlib.Path('release-notes.md').write_text(notes)
          subprocess.run(['gh','release','edit',tag,'--notes-file','release-notes.md'],check=True)
          public=api('releases/tags/'+tag);actual={a['name']:a for a in public['assets']}
          assert set(actual)==set(expected) and api('git/ref/tags/'+tag)['object']['sha']==tag_sha
          results=[]
          for name in sorted(expected):
              source=delivery/name;sha=digest(source)
              if name in ('README.txt','SHA256SUMS'):
                  readback=pathlib.Path('readback-'+name);download(name,readback)
                  assert readback.stat().st_size==source.stat().st_size and digest(readback)==sha,name
              else:
                  assert sha==expected[name]['sha256'] and actual[name]['id']==next(a['id'] for a in original['assets'] if a['name']==name),name
              assert actual[name]['size']==source.stat().st_size and actual[name]['state']=='uploaded'
              if actual[name].get('digest'):assert actual[name]['digest']=='sha256:'+sha
              results.append({'name':name,'bytes':source.stat().st_size,'sha256':sha,'publicDownloadVerified':True,'url':actual[name]['browser_download_url']})
          assert old_release_snapshot()==preserved
          assert api('git/ref/heads/main')['object']['sha']==main_sha
          proof={'verifiedBuildCommit':initial['verifiedBuildCommit'],'tagCommit':tag_sha,'finalizationCommit':os.environ['GITHUB_SHA'],'publicationRun':40722976911,'assets':results,'previousReleasePreserved':True,'previousRelease':preserved,'mainUnchanged':main_sha,'apkRebuilt':False,'apkResigned':False,'updatedMetadataOnly':['README.txt','SHA256SUMS']}
          pathlib.Path('release-download-verification.json').write_text(json.dumps(proof,indent=2))
          print('READING_RELEASE_FINAL_DOWNLOADS_VERIFIED',json.dumps(proof),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-reading-preview-download-verification
          path: release-download-verification.json
          if-no-files-found: error
