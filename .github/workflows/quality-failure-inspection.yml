name: Inspect exact failed quality acceptance evidence
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[quality-failure-inspection]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only the failed candidate's saved logs and reports
        run: |
          gh run download 40797189929 --name mobile-release-logs-8cae9b06f84ca7ea6d8b21a2e1c38d028562b244 --dir failed-quality
          python3 - <<'PY'
          import pathlib,re,xml.etree.ElementTree as E
          root=pathlib.Path('failed-quality')
          for p in root.rglob('TEST-*.xml'):
              if 'androidTest-results' not in p.as_posix():continue
              for c in E.parse(p).getroot().iter('testcase'):
                  for f in list(c.findall('failure'))+list(c.findall('error')):print('SAVED_ANDROID_FAILURE',c.attrib,(f.text or '')[:18000])
          candidates=list(root.rglob('android-runtime.log'))+list(root.rglob('android-all-processes.log'))
          for p in candidates:
              lines=p.read_text(errors='replace').splitlines()
              print('SAVED_RUNTIME_LOG',p,len(lines))
              selected=set()
              for n,line in enumerate(lines):
                  if re.search(r'Fatal signal|Abort message|backtrace:| F DEBUG|FATAL EXCEPTION',line):
                      selected.update(range(max(0,n-35),min(len(lines),n+160)))
                  if re.search(r'01:08:4[89]|01:08:5[0-9]|01:09:|01:10:3[3-9]|01:10:40',line) and re.search(r'2962|3387|Fatal|crash|blocked|studio|Exception|abort|denied',line):
                      selected.add(n)
              for n in sorted(selected)[:1700]:print('SAVED_RUNTIME_LINE',n,lines[n])
          PY
