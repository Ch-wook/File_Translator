name: Inspect exact failed quality acceptance evidence
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[quality-failure-inspection]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the exact recovery UI failure and semantics tree
        run: |
          gh run download 40814067760 --name quality-storage-ui-9463d4dc6dda303d94869019d33dedac1b37c579 --dir failed-quality
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          root=pathlib.Path('failed-quality')
          for p in root.rglob('TEST-*.xml'):
              if 'androidTest-results' not in p.as_posix():continue
              for c in E.parse(p).getroot().iter('testcase'):
                  for f in list(c.findall('failure'))+list(c.findall('error')):print('SAVED_ANDROID_FAILURE',c.attrib,(f.text or '')[:12000])
          for p in root.rglob('quality-ui-failure.txt'):
              print('RECOVERY_UI_SEMANTICS_TREE_START',p,flush=True)
              print(p.read_text(),flush=True)
              print('RECOVERY_UI_SEMANTICS_TREE_END',flush=True)
          for p in root.rglob('android-runtime.log'):
              for line in p.read_text(errors='replace').splitlines():
                  if 'QUALITY_RECOVERY_UI_FAILURE' in line:print('RUNTIME_UI_DIAGNOSTIC',line,flush=True)
          PY
