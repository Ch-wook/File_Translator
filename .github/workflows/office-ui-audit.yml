name: Inspect pinned Office UI APIs
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[office-ui-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-office-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-ui-api-evidence
          path: artifacts/office-ui-audit/
