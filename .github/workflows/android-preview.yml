name: Android preview verification
on:
  push:
    branches: [codex/original-view-reimplementation]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: original-view-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          chmod +x gradlew
          mkdir -p artifacts/ci
          df -h .
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Unit tests and APK builds
        run: |
          ./gradlew :core:test :core:prepareVisualFixtures :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/gradle.log
      - name: JavaScript permissions and actual Rhwp browser tests
        run: |
          npm ci --prefix scripts/tests
          node --test scripts/tests/*.test.cjs 2>&1 | tee artifacts/ci/javascript.log
          cd scripts/tests
          npx playwright install --with-deps chromium
          npm run test:hangul 2>&1 | tee ../../artifacts/ci/hangul-browser.log
      - name: TypeScript and independent saved-file parsers
        run: |
          (cd .engine-cache/hangul/source/rhwp-studio && npx tsc --noEmit) 2>&1 | tee artifacts/ci/typescript.log
          ./gradlew :core:verifyVisualRoundTrip --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/roundtrip.log
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 35 emulator checks
        id: android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: ./gradlew :app:connectedDebugAndroidTest --max-workers=2 --console=plain 2>&1 | tee artifacts/ci/android-emulator.log
      - name: Verify debug APK and package reproducible evidence
        env:
          EMULATOR_OUTCOME: ${{ steps.android.outcome }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess, json, zipfile, hashlib, xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          out=root/'artifacts/delivery'; out.mkdir(parents=True,exist_ok=True)
          name='document-studio-0.8.1-preview'
          apk=root/'app/build/outputs/apk/debug/app-debug.apk'
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          subprocess.run([str(tools/'apksigner'),'verify','--verbose',str(apk)],check=True,stdout=(root/'artifacts/ci/apk-signature.txt').open('w'),stderr=subprocess.STDOUT)
          subprocess.run([str(tools/'zipalign'),'-c','-P','16','4',str(apk)],check=True)
          manifest=subprocess.check_output([str(tools/'aapt2'),'dump','badging',str(apk)],text=True)
          (root/'artifacts/ci/apk-manifest.txt').write_text(manifest)
          permissions=subprocess.check_output([str(tools/'aapt2'),'dump','permissions',str(apk)],text=True)
          assert 'android.permission.INTERNET' not in permissions, permissions
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert any(n.startswith('assets/hangul/') and n.endswith('.wasm') for n in names)
              for abi in ('arm64-v8a','x86_64'): assert 'lib/'+abi+'/libandroidapp.so' in names
          shutil.copy2(apk,out/(name+'-debug.apk'))
          subprocess.run(['git','archive','--format=zip','-o',str(out/(name+'-source.zip')),'HEAD'],check=True)
          with (out/(name+'-changes.patch')).open('wb') as f:
              subprocess.run(['git','diff','--binary','2bfe225ab040e3cb9251a8cafce9578ea3d9b645','HEAD'],stdout=f,check=True)
          subprocess.run(['git','bundle','create',str(out/(name+'-history.bundle')),'--all'],check=True)
          reports={}
          for module in ('core','app'):
              suites=[]
              for p in (root/module/'build/test-results').rglob('TEST-*.xml'):
                  t=ET.parse(p).getroot()
                  suites.append({k:int(t.get(k,0)) for k in ('tests','failures','errors','skipped')})
              reports[module]={k:sum(x[k] for x in suites) for k in ('tests','failures','errors','skipped')}
          summary={'commit':os.environ['GITHUB_SHA'],'baseline':'2bfe225ab040e3cb9251a8cafce9578ea3d9b645','provenance':'reimplementation; previous unpushed 0.8.0 not recovered','physicalDeviceTested':False,'androidEmulatorOutcome':os.environ['EMULATOR_OUTCOME'],'unitTests':reports,'apkBytes':apk.stat().st_size,'debugSigned':True}
          (root/'artifacts/ci/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(out/(name+'-verification.zip'),'w',zipfile.ZIP_DEFLATED) as z:
              for folder in ('artifacts/ci','artifacts/document-engines','core/build/test-results','app/build/test-results','app/build/outputs/androidTest-results','app/build/reports','core/build/visual-fixtures'):
                  for p in (root/folder).rglob('*'):
                      if p.is_file(): z.write(p,p.relative_to(root))
          text='Reimplemented preview from 2bfe225; original unpushed 0.8.0 source was not recovered.\nDevelopment/debug signature; two ABIs. Physical Android device tests were not run.\nAndroid emulator outcome: '+os.environ['EMULATOR_OUTCOME']+'\nCommit: '+os.environ['GITHUB_SHA']+'\nSee verification ZIP for executed checks and limitations.\n'
          (out/'README.txt').write_text(text)
          lines=[]
          for p in sorted(out.iterdir()):
              if p.is_file():
                  with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
                  lines.append(digest+'  '+p.name)
          (out/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          PY
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: document-studio-preview-${{ github.sha }}
          path: artifacts/delivery/
          if-no-files-found: error
          compression-level: 0
      - name: Publish this verified reimplementation preview
        if: contains(github.event.head_commit.message, '[publish-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q 'versionName = "0.8.1-preview"' app/build.gradle.kts
          gh release create "v0.8.1-preview" artifacts/delivery/* --target "$GITHUB_SHA" --prerelease --title "문서 스튜디오 0.8.1-preview · 원본 보기 우선 재구현" --notes-file artifacts/delivery/README.txt
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs-${{ github.sha }}
          path: |
            artifacts/ci/
            artifacts/document-engines/
            app/build/reports/
            app/build/outputs/androidTest-results/
            core/build/test-results/
            app/build/test-results/
          if-no-files-found: warn
