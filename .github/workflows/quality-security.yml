name: Release structure and public dependency audit
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[quality-security]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
            .engine-cache/hangul/source
            .engine-cache/hangul/rhwp-core-0.8.7.tgz
          key: quality-foundation-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-gradle-${{ runner.os }}-
            hangul-public-tools-${{ runner.os }}-
      - name: Build unsigned release and resolve runtime inventory
        run: |
          chmod +x gradlew
          ./gradlew -PstudioAbi=arm64-v8a :app:assembleRelease :app:writeQualityRuntimeInventory --max-workers=2 --console=plain
          python3 scripts/audit-commercial-quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-security-${{ github.sha }}
          path: |
            artifacts/quality-security/
          if-no-files-found: error
