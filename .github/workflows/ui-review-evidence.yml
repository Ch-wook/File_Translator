name: Review actual compact editor screenshots
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    if: contains(github.event.head_commit.message, '[ui-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read exact completed browser and native evidence
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,xml.etree.ElementTree as ET
          repo='Ch-wook/File_Translator'
          candidates=[('40480404587','hangul-mobile-web-b85aa606d55ebcd401f677bc081e1a62f7c3de13'),('40480404675','focused-mobile-ui-b85aa606d55ebcd401f677bc081e1a62f7c3de13')]
          native_run='40481181541';native_sha='5d96549577646c5c76d4cbc9ef180197755fa1f4'
          info=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{native_run}']))
          if info['status']=='completed':candidates.append((native_run,'mobile-release-logs-'+native_sha))
          for run,name in candidates:
              dest=pathlib.Path('evidence')/run
              subprocess.run(['gh','run','download',run,'--repo',repo,'--name',name,'--dir',str(dest)],check=True)
              pictures=list(dest.rglob('*.png'))
              patterns=['compact-web-412x915.png','hwpx-edit-requested.png','docx-compact-font.png','docx-view.png','xlsx-view.png','pptx-view.png','failure.png','text-character-panel.png']
              for pattern in patterns:
                  p=next((p for p in pictures if p.name==pattern),None)
                  if p:print('ACTUAL_COMPACT_UI_PNG',json.dumps({'path':str(p.relative_to(dest)),'run':run,'base64':base64.b64encode(p.read_bytes()).decode()}),flush=True)
              for p in dest.rglob('failure.xml'):
                  nodes=ET.parse(p).getroot().iter('node')
                  selected=[{key:n.get(key) for key in ('text','content-desc','bounds','enabled','visible-to-user')} for n in nodes if n.get('package')=='kr.documentstudio.compactpreview' and (n.get('text') or n.get('content-desc'))]
                  print('ACTUAL_APP_UI_NODES',str(p.relative_to(dest)),json.dumps(selected,ensure_ascii=False))
              for p in dest.rglob('*.json'):
                  if p.name in ('android-summary.json','summary.json') or 'failure' in p.name or p.name=='ui-state.json':
                      text=p.read_text()
                      if len(text)<30000:print('ACTUAL_UI_RESULT',str(p.relative_to(dest)),text)
          PY
