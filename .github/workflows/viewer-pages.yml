name: Actual multi-page viewer browser acceptance
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
jobs:
  browser:
    if: contains(github.event.head_commit.message, '[viewer-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
            ~/.cache/ms-playwright
            .engine-cache/hangul/source
            .engine-cache/hangul/rhwp-core-0.8.7.tgz
          key: viewer-tools-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            viewer-tools-${{ runner.os }}-
            hangul-public-tools-${{ runner.os }}-
      - name: Real engine and distinct multi-page fixtures
        run: |
          chmod +x gradlew
          pip install python-docx python-pptx openpyxl
          ./gradlew :core:prepareVisualFixtures --configure-on-demand --max-workers=2 --console=plain
          python3 scripts/prepare-viewer-fixtures.py
          python3 scripts/prepare-hangul-engine.py
          npm ci --prefix scripts/tests --ignore-scripts
          (cd scripts/tests && npx playwright install chromium)
      - name: All twenty actual pages, scroll, touch zoom, modes and byte protection
        run: node scripts/tests/viewer-pages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-pages-${{ github.sha }}
          path: |
            artifacts/viewer/
            artifacts/open-fixtures/viewer-fixtures.json
