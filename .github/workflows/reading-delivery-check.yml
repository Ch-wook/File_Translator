name: Validate reading preview delivery metadata
on:
  push:
    branches: [codex/hangul-mobile-editing]
permissions:
  contents: read
jobs:
  syntax:
    if: contains(github.event.head_commit.message, '[publish-reading-check]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publisher and benchmark scripts without rebuilding the app
        run: |
          python3 - <<'PY'
          import ast,pathlib,re,textwrap
          source=pathlib.Path('.github/workflows/publish-reading-preview.yml').read_text()
          blocks=re.findall(r"(?m)^([ ]*)python3 - <<'PY'\n(.*?)^\1PY[ \t]*$",source,re.S)
          assert len(blocks)==4,len(blocks)
          for _,block in blocks:ast.parse(textwrap.dedent(block))
          for name in ('scripts/package-mobile-release.py','scripts/summarize-reading-evidence.py','scripts/test-mobile-installation.py'):
              ast.parse(pathlib.Path(name).read_text())
          script=pathlib.Path('scripts/run-reading-performance.sh').read_text()
          embedded=script.split("python3 - <<'PY'\n")[-1].rsplit('\nPY',1)[0]
          ast.parse(embedded)
          assert "'tests':52" in source and 'coexistsWith088' in source
          assert '원래 실행의 앱 검사 44건' not in source
          print('READING_DELIVERY_SYNTAX_OK',len(blocks))
          PY
